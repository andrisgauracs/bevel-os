## IDF Component Manager Manifest File
dependencies:
  idf:
    version: '>=6.0'
  # USB host stack (a managed component since ESP-IDF 6) and its HID class driver
  espressif/usb: ^1.0.0
  espressif/usb_host_hid: ^1.0
  # loadable apps
  espressif/elf_loader: "*"
  # display panel and touch controller of the JC1060P470-V2
  espressif/esp_lcd_jd9165: ^2.0.0
  espressif/esp_lcd_touch_gt911: ^1.2.0
  # Wi-Fi: the esp_wifi API is forwarded to the ESP32-C6 on the module over SDIO
  espressif/esp_wifi_remote: ^1.6.0
  espressif/esp_hosted: ^3.0.0
